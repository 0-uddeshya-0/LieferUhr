server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    # API reverse proxy — same origin, so no CORS and cookies just work.
    # No trailing slash: the API mounts all product routes under /api itself.
    # resolver + variable defers DNS to request time, so nginx survives api restarts.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api http://api:3001;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
    }

    # FrachtRadar SPA — nested under /fleet/ (vite base already matches).
    location /fleet/ {
        try_files $uri $uri/ /fleet/index.html;
    }

    # Suite SPA — four standalone tools, nested under /suite/.
    location /suite/ {
        try_files $uri $uri/ /suite/index.html;
    }

    # Hashed vite assets are immutable; everything else revalidates.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }
    location /fleet/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }
    location /suite/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Lieferuhr Einkauf SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
