name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @lieferradar/shared build

      - name: Build web for GitHub Pages
        run: pnpm --filter @lieferradar/web build
        env:
          VITE_DEMO_MODE: "true"

      # The umbrella page links out to the fleet demo, which ships nested
      # under /LieferUhr/fleet/ inside the same Pages artifact.
      - name: Build fleet demo for GitHub Pages
        run: pnpm --filter @lieferradar/fleet build
        env:
          VITE_DEMO_MODE: "true"

      - name: Nest fleet demo under /fleet/
        run: |
          mkdir -p apps/web/dist/fleet
          cp -R apps/fleet/dist/. apps/web/dist/fleet/

      # The suite app — four standalone AI tools — ships nested under
      # /LieferUhr/suite/ in the same Pages artifact.
      - name: Build suite demo for GitHub Pages
        run: pnpm --filter @lieferradar/suite build
        env:
          VITE_DEMO_MODE: "true"

      - name: Nest suite demo under /suite/
        run: |
          mkdir -p apps/web/dist/suite
          cp -R apps/suite/dist/. apps/web/dist/suite/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
